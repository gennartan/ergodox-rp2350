CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Stream logs over SWD using RTT channel 0 (Raspberry Pi Debug Probe/OpenOCD).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=0
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Keep USB CDC ACM serial initialization disabled
CONFIG_UDC_RPI_PICO=y
CONFIG_USB_CDC_ACM=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_NUM_PREEMPT_PRIORITIES=6

CONFIG_ERGODOX_SPLIT_UART=y
CONFIG_ERGODOX_KEYBOARD_LAYOUT_CUSTOM=y

# USB networking is registered only when the boot chord selects configurator mode.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=n
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS=""
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_NET_HTTP_SERVER_LOG_LEVEL_INF=y
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# One versioned binary configuration record in a dedicated 16 KiB partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
