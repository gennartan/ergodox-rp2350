CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_USBD_CDC_ACM_CLASS=y

CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="My Zephyr Project"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CDC ACM serial backend"
CONFIG_CDC_ACM_SERIAL_VID=0x2fe3
CONFIG_CDC_ACM_SERIAL_PID=0x0004

CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_HID_IN_BUF_COUNT=2
CONFIG_USBD_HID_OUT_BUF_COUNT=2
CONFIG_USBD_HID_INIT_PRIORITY=50

CONFIG_USB_DEVICE_STACK=n
