CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Disable USB CDC ACM serial API because this project uses USB HID only
CONFIG_UDC_RPI_PICO=y
CONFIG_USB_CDC_ACM=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Use UART for console instead of USB CDC ACM
CONFIG_UART_CONSOLE=y

# Thread for matrix scanning
CONFIG_NUM_PREEMPT_PRIORITIES=6
